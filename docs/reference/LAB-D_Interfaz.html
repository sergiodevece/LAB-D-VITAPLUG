*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  padding: clamp(14px, 3vw, 42px) clamp(8px, 2.5vw, 32px);
  display: grid;
  align-content: start;
  justify-items: center;
  background: radial-gradient(ellipse at center top, #252923, #121511 62%, #0b0d0b);
  color: var(--cream);
}
main { width: min(100%, 1320px); }
button, input { font: inherit; }
button { color: inherit; }
button:enabled, [role="slider"], input[type="range"] { cursor: pointer; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible {
  outline: 2px solid var(--amber);
  outline-offset: 3px;
}
button:disabled { opacity: .46; }
.rack {
  display: grid;
  grid-template-columns: 33px minmax(0, 1fr) 33px;
  isolation: isolate;
  border: 1px solid #030504;
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 28px 50px #0009, 0 2px 8px #000a, 0 0 0 1px #afb09b24;
}
.ear {
  position: relative;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  align-items: center;
  padding: 51px 0;
  background: var(--grain), linear-gradient(90deg, #181a16, #30312a 13%, #1b1d17 71%, #080a07);
  box-shadow: inset 0 1px 0 #a9a59770, inset 0 -1px 0 #000;
}
.ear:last-child {
  background: var(--grain), linear-gradient(90deg, #080a07, #1b1d17 20%, #30312a 86%, #181a16);
}
.ear::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--wear-ear-left) center / 100% 100% no-repeat;
  pointer-events: none;
}
.ear:last-child::before {
  background-image: var(--wear-ear-right);
}
.ear span {
  position: relative;
  width: 20px;
  height: 10px;
  border-radius: 7px;
  background: #080a08;
  box-shadow: inset 0 2px 3px #000, 0 1px 0 #918b7755, 0 -1px 0 #000;
}
.ear span::after {
  content: "";
  position: absolute;
  inset: 0 3px -1px 1px;
  border-bottom: 1px solid #a6a08993;
  border-radius: inherit;
  clip-path: polygon(0 70%, 26% 88%, 53% 80%, 77% 100%, 21% 100%, 0 88%);
  pointer-events: none;
}
.plate {
  position: relative;
  padding-inline: 24px;
  background: var(--grain), radial-gradient(ellipse at 31% -10%, #536048a6, transparent 67%),
    linear-gradient(144deg, #394733, #2b3527 62%, #20291f);
  box-shadow: inset 0 1px 0 #ddd6a1a3, inset 0 -2px 0 #0d130f, inset 1px 0 #bfc2a467, inset -1px 0 #bfc2a440;
}
.plate::before {
  content: "";
  position: absolute;
  inset: 0;
  background: var(--wear-edge-top) left top / 100% 25px no-repeat,
    var(--wear-edge-bottom) left bottom / 100% 25px no-repeat;
  pointer-events: none;
}

/* END LAB-D wear textures */
.screw {
  position: absolute;
  z-index: 2;
  height: 13px;
  width: 13px;
  border-radius: 50%;
  pointer-events: none;
  background: radial-gradient(circle at 30% 23%, #c4bd9c, #6c6653 35%, #3a392d 64%, #131711 71%);
  box-shadow: 0 1px 2px #000e, 0 0 0 1px #23271c;
}
.screw::after {
  content: "";
  position: absolute;
  inset: 5px 2px;
  rotate: -35deg;
  border-radius: 2px;
  background: #202017;
  box-shadow: 0 1px #c2b7998a;
}
.screw.tl { top: 12px; left: 8px; }
.screw.tr { top: 12px; right: 8px; }
.screw.bl { bottom: 12px; left: 8px; }
.screw.br { bottom: 12px; right: 8px; }
.masthead {
  min-height: 78px;
  padding: 12px 8px 13px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  border-bottom: 1px solid #d3c99d8a;
  box-shadow: 0 1px 0 #0d190e55;
}
.maker, .nameplate { display: flex; align-items: center; gap: 14px; }
.brand, .model { font-family: "Arial Narrow", "Liberation Sans Narrow", system-ui, sans-serif; }
.brand {
  font-size: 30px;
  line-height: 1;
  font-weight: 800;
  letter-spacing: .115em;
  text-shadow: 0 1px 1px #151b0e;
}
.signature { color: #ded4b7; font-size: 12px; white-space: nowrap; letter-spacing: .015em; }
.model {
  font-size: 43px;
  line-height: .98;
  letter-spacing: .035em;
  font-weight: 900;
  text-shadow: 0 2px 1px #12180f;
}
.model-kind {
  padding-left: 13px;
  border-left: 1px solid #cfc49d66;
  font-weight: 650;
  font-size: 10px;
  white-space: nowrap;
  letter-spacing: .165em;
  color: #dfd4b4;
}
.panels {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1.48fr) minmax(0, 1.1fr);
  padding-block: 20px 18px;
}
.panel { min-width: 0; display: flex; flex-direction: column; padding-inline: 18px; }
.panel:first-child { padding-left: 0; }
.panel:last-child { padding-right: 0; }
.panel + .panel { border-left: 1px solid var(--rule); box-shadow: inset 1px 0 #18201355; }
.panel-head {
  min-height: 31px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}
h2 {
  margin: 0;
  color: var(--cream);

<script>
"use strict";
const byId = (id) => document.getElementById(id);
const clamp = (value, min, max) => Math.min(max, Math.max(min, value));
const BPM = 120;
const SR = 48000;
const F_MIN = 20;
const F_MAX = 20000;
const tau = Math.PI * 2;
const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

const music = [1, 2, 4, 8, 16, 32].flatMap((denominator) => {
  const base = 4 / denominator;
  const note = "1/" + denominator;
  return [[note + "D", base * 1.5], [note, base], [note + "T", base * 2 / 3]];
}).sort((a, b) => b[1] - a[1]);
const rates = [["8 BAR", 32], ["4 BAR", 16], ["2 BAR", 8], ...music];
const times = [...music].reverse();
const indexOf = (table, name) => table.findIndex(([label]) => label === name);
const msFrom = (table, index) => table[index][1] * 60000 / BPM;

const baseBands = [
  { type: "lowcut",  f: 85,   g: 0,    q: .71, on: true },
  { type: "lowshelf", f: 225,  g: -1.5, q: .71, on: true },
  { type: "bell",    f: 640,  g: -3.5, q: 1.1, on: true },
  { type: "bell",    f: 1500, g: 3,    q: .95, on: true },
  { type: "bell",    f: 3750, g: -1.8, q: 1.2, on: true },
  { type: "highcut", f: 8100, g: 0,    q: .71, on: true },
];
const typeLabels = { lowcut: "LOW CUT", lowshelf: "LOW SHELF", bell: "BELL", highshelf: "HIGH SHELF", highcut: "HIGH CUT" };
const initialTime = { "L": [350, indexOf(times, "1/8D")], "R": [500, indexOf(times, "1/4")] };
const state = {
  timeSync: true, linked: false, eqOn: true, band: 2, bypass: false, wetLock: false,
